<!DOCTYPE html>
<html lang="tr">

<title>UstaPlan — Mobil Tasarım Önizlemesi</title>
<style>
:root{--bg:#f7f8f5;--surface:#fff;--ink:#1c2923;--muted:#68766e;--green:#19745a;--soft:#eaf4ef;--line:#e5eae5;--amber:#ba7b2c;--red:#b64b4b;--radius:17px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;color:var(--ink)}
*{box-sizing:border-box}body{background:#eef1ec;margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.outer{padding:30px 18px 45px}.info{max-width:560px;margin:0 auto 20px;display:flex;justify-content:space-between;align-items:center;gap:14px}.info h1{font-size:18px;letter-spacing:-.5px;margin:0 0 4px}.info p{font-size:12px;color:var(--muted);margin:0}.switch{display:flex;gap:3px;padding:4px;background:#e0e7df;border-radius:11px}.switch button{font-size:12px;color:#55645b;padding:10px 12px;white-space:nowrap;border:0;border-radius:8px;background:transparent;font-weight:650}.switch .active{background:#fff;color:var(--ink);box-shadow:0 1px 4px #113a2019}.phone{width:min(100%,410px);min-height:820px;margin:0 auto;position:relative;background:var(--bg);border-radius:34px;border:8px solid #26332b;box-shadow:0 26px 80px #1e382c21;overflow:hidden}.statusbar{height:35px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--bg);font-size:12px;font-weight:750}.statusbar .right{display:flex;gap:6px;align-items:center;font-size:10px}.app{min-height:770px}.page{padding:20px 21px 104px;min-height:736px}.toptitle{display:flex;justify-content:space-between;align-items:start;margin-bottom:23px}.eyebrow{font-size:12px;color:var(--muted);margin-bottom:5px}.h1{font-size:26px;letter-spacing:-.9px;line-height:1.13;font-weight:740;margin:0}.round-btn{height:39px;width:39px;display:grid;place-items:center;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--ink)}.label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:23px 0 12px}.hero{background:var(--green);padding:20px;border-radius:20px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px}.hero .big{font-size:23px;font-weight:760;letter-spacing:-.5px}.hero .sub{font-size:12px;opacity:.8;margin-top:6px}.hero .heroIcon{border:1px solid #ffffff55;background:#ffffff19;border-radius:15px;padding:12px}.card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:15px;margin-top:10px;box-shadow:0 1px 0 #192c2005}.itemheader{display:flex;align-items:center;justify-content:space-between;gap:8px}.itemtitle{font-size:15px;font-weight:750;letter-spacing:-.2px}.itemmeta{color:var(--muted);font-size:12px;margin-top:7px}.desc{font-size:13px;margin:10px 0 0;color:#3d5147}.pill{font-size:10px;padding:6px 8px;border-radius:20px;white-space:nowrap;font-weight:700;background:#eff3ef;color:#61756a}.pill.green{color:var(--green);background:var(--soft)}.pill.amber{color:#976118;background:#fff5e7}.pill.red{background:#fff0ef;color:var(--red)}.time{display:flex;gap:8px;align-items:center;color:var(--green);font-size:13px;font-weight:720;margin-top:13px}.actions{display:flex;gap:8px;margin-top:14px}.tinybutton{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}.tinybutton.fill{background:var(--soft);border-color:var(--soft);color:var(--green)}.actions>*{flex:1}.primary{border:0;background:var(--green);color:white;font-weight:720;border-radius:13px;padding:14px 17px;min-height:47px;display:flex;align-items:center;justify-content:center;gap:7px;width:100%}.secondary{background:white;color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:13px 15px;font-weight:720;width:100%}.danger{color:var(--red);border:1px solid #edd0ce;background:#fff;border-radius:13px;padding:13px;font-weight:720;width:100%}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.nav{height:77px;position:absolute;bottom:0;left:0;right:0;background:#ffffffed;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 8px 14px}.nav button{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;color:#88968b;background:none;border:0;font-size:10px;font-weight:700}.nav button.active{color:var(--green)}.nav svg{width:21px;height:21px}.fab{position:absolute;right:22px;bottom:91px;border:0;display:flex;align-items:center;gap:8px;background:var(--green);color:#fff;font-weight:750;font-size:13px;border-radius:15px;padding:13px 16px;box-shadow:0 9px 22px #19745a36}.subtle{color:var(--muted);font-size:13px;line-height:1.55}.link{background:transparent;border:0;color:var(--green);font-weight:750;font-size:13px;padding:0}.divider{height:1px;background:var(--line);margin:19px 0}.formlabel{font-size:12px;font-weight:760;display:block;margin:17px 0 7px;color:#384c40}.field{border:1px solid #dce4dc;background:#fff;padding:12px;border-radius:12px;width:100%;color:var(--ink);font-size:14px;min-height:45px}.field:focus{outline:2px solid #a4d6be;border-color:var(--green)}textarea.field{resize:vertical;min-height:75px}.checkrow{display:flex;align-items:center;gap:10px;margin:17px 0;font-size:14px;font-weight:650}input[type=checkbox],input[type=radio]{accent-color:var(--green)}.note{padding:12px 14px;border-radius:12px;background:var(--soft);font-size:12px;line-height:1.5;color:#385c49;margin:12px 0}.warning{border:1px solid #f0d8b9;background:#fff8ec;padding:13px;border-radius:13px;color:#856321;font-size:12px;line-height:1.5;margin-top:12px}.customerHero{padding:24px 0 14px;text-align:left}.brand{font-size:12px;color:var(--green);font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin-bottom:10px}.customerHero h2{font-size:25px;letter-spacing:-.7px;line-height:1.15;margin:10px 0}.customerHero p{font-size:13px;color:var(--muted)}.largeDate{display:flex;gap:12px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px}.dateIcon{background:var(--soft);color:var(--green);height:49px;width:49px;display:grid;place-items:center;border-radius:13px}.largeDate b{font-size:15px}.largeDate small{font-size:12px;color:var(--muted)}.mediaTiles{display:flex;gap:9px}.tile{height:88px;width:88px;border-radius:13px;background:#edf2ed;border:1px solid #dfe6df;display:grid;place-items:center;color:#718579;position:relative;overflow:hidden}.tile b{font-size:11px}.tile.upload{border:1px dashed #9db6a8;background:#fff;color:var(--green);cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:4px}.tile img{width:100%;height:100%;object-fit:cover}.tile .delete{position:absolute;right:3px;top:3px;border:0;background:#ffffffeb;color:var(--red);border-radius:100%;height:22px;width:22px;font-size:14px}.modalback{position:absolute;z-index:25;inset:0;background:#1c292354;display:flex;align-items:flex-end}.modal{background:#fff;border-radius:24px 24px 0 0;padding:22px 22px 30px;width:100%;max-height:83%;overflow:auto;box-shadow:0 -15px 60px #22332a1b}.modal h3{font-size:19px;letter-spacing:-.3px;margin:0 0 9px}.modal p{color:var(--muted);font-size:13px;line-height:1.5}.option{border:1px solid var(--line);padding:12px;border-radius:11px;display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px;cursor:pointer}.option:has(input:checked){border-color:#9ac9b4;background:var(--soft)}.btnstack{display:flex;gap:9px;margin-top:18px}.btnstack>*{flex:1}.back{background:none;border:0;padding:0;margin:0 0 17px;display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;font-weight:720}.listitem{display:flex;gap:13px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.avatar{background:#e9ede7;display:grid;place-items:center;min-width:42px;height:42px;border-radius:12px;color:var(--green);font-weight:760}.listitem .name{font-size:14px;font-weight:750}.listitem .small{font-size:12px;color:var(--muted);margin-top:5px}.contentclick{cursor:pointer}.timeline{display:flex;gap:12px;align-items:flex-start;border-left:2px solid #dfe8de;margin-left:9px;padding:0 0 24px 18px;position:relative}.timeline:before{position:absolute;content:'';height:10px;width:10px;border-radius:50%;border:3px solid var(--bg);background:var(--green);left:-7px;top:0}.timeline b{font-size:13px}.timeline small{display:block;font-size:12px;color:var(--muted);margin-top:4px}.toast{position:absolute;bottom:90px;left:19px;right:19px;background:#213d30;color:#fff;border-radius:12px;padding:13px;text-align:center;font-size:12px;box-shadow:0 6px 25px #0002;z-index:30}.footnote{max-width:600px;text-align:center;margin:16px auto 0;color:#607067;font-size:12px;line-height:1.5}@media(max-width:500px){.outer{padding:0}.info{padding:12px 13px;margin:0;max-width:none;display:grid}.info h1{font-size:14px}.info p{font-size:11px}.switch{justify-content:center}.phone{border:0;border-radius:0;width:100%;min-height:calc(100dvh - 106px);box-shadow:none}.app{min-height:calc(100dvh - 142px)}.page{min-height:calc(100dvh - 154px)}.nav{position:fixed}.fab{position:fixed}.footnote{padding:0 15px}}
</style>
</head>
<body>
<div class="outer">
 <div class="info"><div><h1>UstaPlan <span style="font-weight:450;color:#738478">/ Tasarım örneği</span></h1><p>İnteraktif görsel prototip · Gerçek veritabanına bağlı değildir</p></div><div class="switch"><button id="artisanSwitch" class="active" onclick="changeRole('artisan')">Usta uygulaması</button><button id="customerSwitch" onclick="changeRole('customer')">Müşteri bağlantısı</button></div></div>
 <div class="phone"><div class="statusbar"><span>09:41</span><span class="right">●●● ▰</span></div><div id="app" class="app"></div><div id="overlays"></div><div id="toastLayer"></div></div>
 <p class="footnote">Bu dosya UX referansıdır. Formlar ve örnek işlemler yalnızca tarayıcı belleğinde çalışır; gerçek bir işi iptal etmez veya mesaj göndermez.</p>
</div>
<script>
const ICON={calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',plus:'<path d="M12 5v14M5 12h14"/>',bell:'<path d="M18 8a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/>',users:'<path d="M16 20v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M8.5 10a4 4 0 100-8 4 4 0 000 8ZM20 20v-2a4 4 0 00-3-3.87M16 2.13a4 4 0 010 7.75"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',home:'<path d="m3 10 9-7 9 7v11H3zM9 21v-7h6v7"/>',chevron:'<path d="m9 18 6-6-6-6"/>',back:'<path d="m15 18-6-6 6-6"/>',phone:'<path d="M22 16.9v3a2 2 0 01-2.2 2A19 19 0 012 4.2 2 2 0 014 2h3a2 2 0 012 1.7L9.6 7a2 2 0 01-.6 2L7 11a16 16 0 006 6l2-2a2 2 0 012-.6l3.3.6A2 2 0 0122 16.9z"/>',message:'<path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 014 11.5a8.5 8.5 0 014.7-7.6A8.4 8.4 0 0112.5 3H13a8.5 8.5 0 018 8v.5z"/>',map:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1116 0Z"/><circle cx="12" cy="10" r="2.5"/>',camera:'<path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="3"/>',check:'<path d="m4 12 5 5L20 6"/>',warn:'<path d="m12 3 10 18H2L12 3ZM12 9v4m0 4v.01"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 00-.1-1l2-1.6-2-3.4-2.4 1A8 8 0 0016 6l-.4-2.6h-4L11.2 6a8 8 0 00-1.6 1L7.2 6l-2 3.4L7.2 11a8 8 0 000 2L5.2 14.6l2 3.4 2.4-1a8 8 0 001.6 1l.4 2.6h4L16 18a8 8 0 001.6-1l2.4 1 2-3.4L19.9 13A8 8 0 0020 12z"/>',image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0M12 17v5m-4 0h8"/>'};
const ico=(k,size=18)=>`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]||ICON.list}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let role='artisan',page='today',viewJob=1,clientCancelled=false,pending=false,counter=false,noticeTimer;
let jobs=[{id:1,title:'Mutfak musluğu değişimi',customer:'Ahmet Yılmaz',time:'09:30',status:'Planlandı',address:'Bakırköy',price:2500,hasAppointment:true},{id:2,title:'Elektrik panosu kontrolü',customer:'Ayşe Demir',time:'13:00',status:'Planlandı',address:'Ataköy',price:1800,hasAppointment:true},{id:3,title:'Dolap kapağı onarımı',customer:'Ali Kaya',time:'',status:'Parça bekleniyor',address:'Zeytinlik',price:0,hasAppointment:false}];
const photoItems=[];
const statusStyle=s=>s==='Planlandı'?'green':s==='İptal edildi'?'red':s==='Parça bekleniyor'?'amber':'';
function toast(s){document.getElementById('toastLayer').innerHTML=`<div class="toast">${esc(s)}</div>`;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>document.getElementById('toastLayer').innerHTML='',2800)}
function changeRole(r){role=r;page='today';document.getElementById('artisanSwitch').classList.toggle('active',r==='artisan');document.getElementById('customerSwitch').classList.toggle('active',r==='customer');render()}
function nav(p){page=p;render()}
function navHtml(){return `<div class="nav">${[['today','home','Bugün'],['calendar','calendar','Takvim'],['jobs','list','İşler'],['customers','users','Müşteriler']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="nav('${x[0]}')">${ico(x[1])}<span>${x[2]}</span></button>`).join('')}</div>`}
const jobCard=j=>`<article class="card contentclick" onclick="openJob(${j.id})"><div class="itemheader"><div class="itemtitle">${esc(j.customer)}</div><span class="pill ${statusStyle(j.status)}">${esc(j.status)}</span></div><div class="desc">${esc(j.title)}</div>${j.time?`<div class="time">${ico('clock',15)} Bugün · ${j.time}</div>`:`<div class="itemmeta">Henüz yeni randevu yok</div>`}<div class="actions"><button class="tinybutton" onclick="event.stopPropagation();toast('Arama özelliği gerçek uygulamada çalışır')">${ico('phone',14)} Ara</button><button class="tinybutton fill" onclick="event.stopPropagation();toast('WhatsApp bağlantısı gerçek uygulamada açılır')">${ico('message',14)} WhatsApp</button></div></article>`;
function today(){let planned=jobs.filter(x=>x.time&&x.status!=='İptal edildi');let follow=jobs.filter(x=>!x.time&&x.status!=='İptal edildi');return `<div class="toptitle"><div><div class="eyebrow">17 Ekim, Cumartesi</div><h2 class="h1">Bugün</h2></div><button class="round-btn" aria-label="Ayarlar" onclick="nav('settings')">${ico('settings')}</button></div><div class="hero"><div><div class="big">${planned.length} randevun var</div><div class="sub">Bugünün işleri tek yerde.</div></div><div class="heroIcon">${ico('calendar',26)}</div></div><div class="label">Bugünkü randevular</div>${planned.map(jobCard).join('')||'<div class="subtle">Bugün randevu yok.</div>'}<div class="label">Takip gerekenler</div>${follow.map(j=>`<div class="card contentclick" onclick="openJob(${j.id})"><div class="itemheader"><b style="font-size:14px">${esc(j.title)}</b><span class="pill amber">${esc(j.status)}</span></div><div class="itemmeta">${esc(j.customer)} · Randevu planla</div></div>`).join('')||'<div class="subtle">Bekleyen iş yok.</div>'}<button class="fab" onclick="nav('newJob')">${ico('plus',16)} Yeni iş</button>`}
function calendar(){return `<div class="toptitle"><div><div class="eyebrow">Programın</div><h2 class="h1">Takvim</h2></div><button class="round-btn" onclick="nav('newJob')">${ico('plus')}</button></div><div class="card"><div class="itemheader"><b>17 Ekim, Cumartesi</b><span class="pill green">Bugün</span></div><div class="subtle" style="margin-top:8px">Randevuların saat sırasıyla gösterilir. Çakışmalar varsa burada işaretlenir.</div>${jobs.filter(j=>j.time).map(j=>`<div class="listitem contentclick" onclick="openJob(${j.id})"><div style="min-width:51px;color:var(--green);font-weight:760;font-size:13px">${esc(j.time)}</div><div><div class="name">${esc(j.customer)}</div><div class="small">${esc(j.title)} · 60 dk</div></div></div>`).join('')}</div><div class="label">Başka gün seç</div><div class="card"><span class="subtle">Gerçek uygulamada etkileşimli gün/hafta takvimi; dolu saatler ve çakışma uyarıları bulunacak.</span></div>`}
function allJobs(){return `<div class="toptitle"><div><div class="eyebrow">İş defterin</div><h2 class="h1">İşler</h2></div><button class="round-btn" onclick="nav('newJob')">${ico('plus')}</button></div><input class="field" id="searchJobs" placeholder="Müşteri veya iş ara..." oninput="filterJobs()"/><div id="jobsList">${jobs.map(jobCard).join('')}</div>`}
function filterJobs(){let q=document.getElementById('searchJobs').value.toLocaleLowerCase('tr');document.getElementById('jobsList').innerHTML=jobs.filter(j=>(j.title+j.customer).toLocaleLowerCase('tr').includes(q)).map(jobCard).join('')||'<p class="subtle">Eşleşen iş bulunamadı.</p>'}
function customers(){let names=[...new Set(jobs.map(j=>j.customer))];return `<div class="toptitle"><div><div class="eyebrow">Tanıdığın insanlar</div><h2 class="h1">Müşteriler</h2></div><button class="round-btn" onclick="toast('Müşteri oluşturma gerçek uygulamada etkin olacak')">${ico('plus')}</button></div><div class="card">${names.map(n=>`<div class="listitem contentclick" onclick="openCustomer('${esc(n)}')"><div class="avatar">${esc(n.split(' ').map(a=>a[0]).join(''))}</div><div style="flex:1"><div class="name">${esc(n)}</div><div class="small">${jobs.filter(j=>j.customer===n).length} kayıtlı iş</div></div>${ico('chevron',17)}</div>`).join('')}</div>`}
function openCustomer(n){page='customerDetails';window.customerName=n;render()}
function customerDetails(){let n=window.customerName||'Ahmet Yılmaz';return `<button class="back" onclick="nav('customers')">${ico('back',16)} Müşteriler</button><h2 class="h1">${esc(n)}</h2><p class="subtle">Telefon ve adresleri sadece usta yönetir.</p><div class="card"><b>Adresler</b><p class="subtle">Ev · Bakırköy, İstanbul</p><button class="tinybutton" onclick="toast('Adres düzenleme gerçek uygulamada etkin olacak')">Adres düzenle</button></div><div class="label">Geçmiş işler</div>${jobs.filter(j=>j.customer===n).map(jobCard).join('')}`}
function newJob(){return `<button class="back" onclick="nav('today')">${ico('back',16)} Geri</button><div class="eyebrow">Hızlı kayıt</div><h2 class="h1">Yeni iş</h2><form id="jobForm" onsubmit="saveJob(event)"><label class="formlabel">Müşteri</label><select class="field" id="newCustomer"><option>Ahmet Yılmaz</option><option>Ayşe Demir</option><option>Ali Kaya</option><option>Yeni müşteri</option></select><label class="formlabel">Yapılacak iş</label><textarea class="field" id="newTitle" placeholder="Örn. Mutfak musluğu değişecek" required></textarea><label class="checkrow"><input type="checkbox" id="hasDate" onchange="toggleDate()"> Randevu planla</label><div id="dateFields" style="display:none"><label class="formlabel">Tarih</label><input class="field" type="date" value="2026-10-19" id="apptDate"/><label class="formlabel">Saat</label><input class="field" type="time" value="10:00" id="apptTime"/><div class="warning">${ico('warn',16)} Saat seçerken mevcut randevularla çakışma varsa uyarı gösterilecek; kaydetmeyi engellemeyecek.</div></div><details style="margin:16px 0"><summary style="cursor:pointer;font-size:13px;font-weight:760;color:var(--green)">Diğer detaylar (isteğe bağlı)</summary><label class="formlabel">Anlaşılan fiyat (₺)</label><input class="field" type="number" min="0" id="newPrice" placeholder="0"/><label class="formlabel">Özel not</label><textarea class="field" placeholder="Sadece sen görürsün"></textarea></details><button class="primary" type="submit">${ico('check',18)} İşi kaydet</button></form>`}
function toggleDate(){document.getElementById('dateFields').style.display=document.getElementById('hasDate').checked?'block':'none'}
function saveJob(e){e.preventDefault();const title=document.getElementById('newTitle').value.trim(),date=document.getElementById('hasDate').checked;if(!title)return;const j={id:Date.now(),title,customer:document.getElementById('newCustomer').value==='Yeni müşteri'?'Yeni Müşteri':document.getElementById('newCustomer').value,time:date?document.getElementById('apptTime').value:'',status:date?'Planlandı':'Planlanacak',address:'',price:Number(document.getElementById('newPrice')?.value||0),hasAppointment:date};jobs.push(j);page='jobs';render();toast('Örnek iş eklendi (yalnızca bu sayfada)')}
function openJob(id){viewJob=id;page='jobDetails';render()}
function jobDetails(){let j=jobs.find(j=>j.id===viewJob)||jobs[0];return `<button class="back" onclick="nav('jobs')">${ico('back',16)} Tüm işler</button><div class="row between"><span class="pill ${statusStyle(j.status)}">${esc(j.status)}</span><button class="link" onclick="changeRole('customer')">Müşteri sayfası ↗</button></div><h2 class="h1" style="margin:13px 0 8px">${esc(j.title)}</h2><p class="subtle">${esc(j.customer)} · ${esc(j.address)}</p><div class="card"><div class="row between"><b style="font-size:14px">Randevu</b>${ico('calendar')}</div><p style="font-weight:760">${j.time?'17 Ekim · '+j.time:'Henüz planlanmadı'}</p><button class="secondary" onclick="toast('Tarih düzenleme gerçek uygulamada açılır')">Tarihi düzenle</button></div><div class="card"><div class="row between"><b>İş bilgileri</b><span class="pill">Sadece usta</span></div><p class="subtle">Anlaşılan fiyat</p><b style="font-size:20px">${j.price?j.price.toLocaleString('tr-TR')+' ₺':'—'}</b><div class="divider"></div><b style="font-size:13px">Fotoğraflar ve notlar</b><div class="mediaTiles" style="margin-top:12px"><div class="tile">${ico('image',24)}</div><div class="tile">${ico('mic',24)}</div></div><p class="subtle">Özel fotoğraflar ve sesli notlar müşteriye gösterilmez.</p></div><div class="btnstack"><button class="secondary" onclick="toast('Paylaşım metni gerçek uygulamada oluşturulur')">${ico('message',16)} WhatsApp ile paylaş</button><button class="primary" onclick="markDone(${j.id})">${ico('check',16)} Tamamla</button></div>`}
function markDone(id){const j=jobs.find(x=>x.id===id);if(j)j.status='Tamamlandı';render();toast('Örnek iş tamamlandı')}
function settings(){return `<button class="back" onclick="nav('today')">${ico('back',16)} Bugün</button><div class="eyebrow">Hesabın</div><h2 class="h1">Ayarlar</h2><div class="card"><b>Mehmet Usta</b><p class="subtle">Tesisat hizmetleri · Supabase Auth hesabı</p></div><div class="label">Güvenlik</div><div class="card"><b>Şifre değiştir</b><p class="subtle">Giriş yapmış usta mevcut şifresini kullanarak şifresini değiştirebilir.</p><button class="secondary" onclick="toast('Şifre değiştirme Supabase Auth ile geliştirilecek')">Şifremi değiştir</button></div><p class="subtle">Şifreyi unuttum işlemleri pilot aşamasında yönetici tarafından yapılır.</p>`}
function customer(){const j=jobs[0];return `<div class="customerHero"><div class="brand">UstaPlan · İş Takibi</div><div class="row between"><span class="pill ${clientCancelled?'red':'green'}">${clientCancelled?'İptal edildi':'Planlandı'}</span><span style="color:var(--muted);font-size:12px">Mehmet Usta</span></div><h2>${esc(j.title)}</h2><p>İşinizle ilgili güncel bilgileri buradan takip edebilirsiniz.</p></div><div class="largeDate"><div class="dateIcon">${ico('calendar',25)}</div><div><small>Randevu</small><br/><b>${clientCancelled?'İptal edildi':counter?'Yeni tarih önerildi':pending?'Tarih talebi bekliyor':'19 Ekim 2026, 14:00'}</b></div></div>${pending?`<div class="note">Yeni tarih talebiniz ustaya iletildi. Onay verilene kadar mevcut randevunuz geçerli.<br><button style="margin-top:8px" class="link" onclick="pending=false;counter=true;render()">Örnek karşı teklif göster →</button></div>`:''}${counter?`<div class="note">Usta 21 Ekim 16:30 için karşı teklif iletti. <button class="link" onclick="counter=false;pending=false;render();toast('Örnek karşı teklif kabul edildi')">Kabul et</button></div>`:''}<div class="label">Fotoğraflar</div><div class="mediaTiles"><div class="tile">${ico('image',23)}</div>${photoItems.map((o,i)=>`<div class="tile"><img alt="Yüklenen fotoğraf" src="${o}"><button class="delete" title="Fotoğrafı sil" onclick="removePhoto(${i})">×</button></div>`).join('')}<label class="tile upload">${ico('camera',23)}<b>Fotoğraf ekle</b><input type="file" accept="image/*" style="display:none" onchange="addPhoto(event)"/></label></div><p class="subtle">Yüklediğiniz fotoğrafları buradan silebilirsiniz.</p><div class="label">İş işlemleri</div>${clientCancelled?'<div class="note">Bu iş iptal edildi. Ayrıntı için ustanızla görüşebilirsiniz.</div>':`<button class="secondary" onclick="openModal('date')">${ico('calendar',17)} Tarih değişikliği iste</button><button style="margin-top:9px" class="danger" onclick="openModal('cancel')">İşi iptal et</button>`}<div class="label">Ustanızla iletişim</div><div class="btnstack" style="margin-top:0"><button class="secondary" onclick="toast('Gerçek uygulamada telefon araması açılır')">${ico('phone',16)} Ara</button><button class="primary" onclick="toast('Gerçek uygulamada WhatsApp açılır')">${ico('message',16)} WhatsApp</button></div><p class="subtle" style="font-size:11px;margin-top:20px">Bu bağlantı yalnızca bu işe ait bilgileri gösterir. Müşteri hesabı gerekmez.</p>`}
function addPhoto(e){let f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('Yalnızca fotoğraf yükleyebilirsiniz');if(photoItems.length>=3)return toast('Tasarım örneğinde en fazla 3 fotoğraf');photoItems.push(URL.createObjectURL(f));render();toast('Fotoğraf eklendi (tarayıcı belleği)')}
function removePhoto(i){URL.revokeObjectURL(photoItems[i]);photoItems.splice(i,1);render();toast('Örnek fotoğraf silindi')}
function openModal(type){document.getElementById('overlays').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${type==='cancel'?`<h3>İşi iptal et</h3><p>Ustaya iptal nedeni iletilecek. Bu örnekte gerçek bir iş iptal edilmez.</p><div style="margin:15px 0">${['İhtiyacım kalmadı','Fiyat yüksek geldi','Fikrimi değiştirdim','Başka bir ustayla anlaştım','Tarih uygun değil','Diğer'].map((s,i)=>`<label class="option"><input name="reason" type="radio" value="${s}" ${i===0?'checked':''}/> ${s}</label>`).join('')}</div><label class="formlabel">Açıklama (isteğe bağlı, Diğer için zorunlu)</label><textarea class="field" id="cancelNote" placeholder="Eklemek isterseniz..."></textarea><div class="btnstack"><button class="secondary" onclick="closeModal()">Vazgeç</button><button class="danger" onclick="cancelClientJob()">İptali onayla</button></div>`:`<h3>Tarih değişikliği iste</h3><p>Tercih ettiğiniz tarihi iletin. Ustanız onaylamadan randevunuz değişmez. Ustanın takvimi gösterilmez.</p><label class="formlabel">Yeni tarih</label><input class="field" type="date" id="requestedDate" value="2026-10-21"/><label class="formlabel">Yeni saat</label><input class="field" type="time" id="requestedTime" value="15:00"/><div class="btnstack"><button class="secondary" onclick="closeModal()">Vazgeç</button><button class="primary" onclick="requestDate()">Talep gönder</button></div>`}</div></div>`}
function closeModal(){document.getElementById('overlays').innerHTML=''}
function cancelClientJob(){const checked=document.querySelector('input[name=reason]:checked');const note=document.getElementById('cancelNote').value.trim();if(checked.value==='Diğer'&&!note)return toast('Diğer sebebini açıklayın');clientCancelled=true;closeModal();render();toast('Örnek iş iptal edildi')}
function requestDate(){pending=true;closeModal();render();toast('Örnek tarih talebi oluşturuldu')}
function render(){const content=role==='customer'?customer():({today,calendar,jobs:allJobs,customers,newJob,jobDetails,customerDetails,settings}[page]||today)();document.getElementById('app').innerHTML=`<div class="page">${content}</div>${role==='artisan'&&['today','calendar','jobs','customers'].includes(page)?navHtml():''}`}
render();
</script>
</body>
</html>
