<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#19745A" />
    <title>Bağlantı yok · UstaPlan</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        background: #f7f8f5;
        color: #1c2923;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      .logo {
        width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        background: #19745a; color: #fff; font-size: 24px; font-weight: 700;
      }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 24px; color: #68766e; font-size: 15px; line-height: 1.5; }
      button {
        width: 100%; height: 48px; border: 0; border-radius: 12px;
        background: #19745a; color: #fff; font-size: 16px; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">U</div>
      <h1>İnternet bağlantısı yok</h1>
      <p>Bağlantın gelince sayfa kendiliğinden açılır. Kaydettiğin bilgiler sunucuda duruyor.</p>
      <button type="button" onclick="location.reload()">Tekrar dene</button>
    </main>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
